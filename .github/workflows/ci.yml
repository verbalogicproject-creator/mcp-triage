name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Unit tests
        run: python -m pytest tests/ -q
      - name: Inventory smoke on a fixture config
        run: |
          printf '{"mcpServers":{"a":{"type":"stdio","command":"python3","args":["s.py"]}}}' > /tmp/cfg.json
          python3 scripts/mcp_inventory.py --path /tmp/cfg.json | grep -q "claude mcp add a --scope user -- python3 s.py"
      - name: Vendored engine imports with no third-party packages
        # The stdlib-only invariant: the engine must load in a bare interpreter.
        run: python3 -c "import declared_core; print(declared_core.__version__)"
      - name: Dense booster degrades to nothing when unconfigured
        # The default path must not need numpy or a network. This runs in the
        # bare CI env where neither is available, which is the point.
        run: |
          python3 - <<'PY'
          import os, sys
          os.environ.pop("MCP_TRIAGE_EMBED_URL", None)
          sys.path.insert(0, "scripts"); sys.path.insert(0, ".")
          import dense
          assert dense.build_dense_index([{"id": "a", "name": "n", "description": "d"}]) is None
          assert dense.http_embedder()("text") is None
          assert "lexical only" in dense.dense_status()
          print("ok: dense off by default, no numpy or network needed")
          PY
      - name: Catalog smoke on an empty home (must not crash or invent records)
        run: |
          mkdir -p /tmp/emptyhome /tmp/emptyproj
          python3 scripts/catalog.py --project /tmp/emptyproj --home /tmp/emptyhome --json | grep -q '^\[\]$'
      - name: Ranking smoke — a suggestion must trace to a real path
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          out = subprocess.run(
              [sys.executable, "scripts/triage_rank.py", "debug a failing pytest suite",
               "--project", "/tmp/emptyproj", "--json"],
              capture_output=True, text=True, check=True).stdout
          parts = json.loads(out)
          for bucket in parts.values():
              for hit in bucket:
                  assert hit.get("path") is not None, hit
          print("ok: every hit carries a path")
          PY
