name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # Full suite with the optional dependency present, so the dense index actually
  # gets built and its caching, pruning and invalidation are really exercised.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest + numpy
        run: python -m pip install pytest numpy
      - name: Unit tests (nothing should skip here)
        run: python -m pytest tests/ -q
      - name: Inventory smoke on a fixture config
        run: |
          printf '{"mcpServers":{"a":{"type":"stdio","command":"python3","args":["s.py"]}}}' > /tmp/cfg.json
          python3 scripts/mcp_inventory.py --path /tmp/cfg.json | grep -q "claude mcp add a --scope user -- python3 s.py"
      - name: Vendored engine imports cleanly
        run: python3 -c "import declared_core; print(declared_core.__version__)"
      - name: Dense booster stays off when unconfigured
        # numpy is installed in this job, so this proves the *feature flag* is
        # what gates dense — not merely the absence of the dependency.
        run: |
          python3 - <<'PY'
          import os, sys
          os.environ.pop("MCP_TRIAGE_EMBED_URL", None)
          sys.path.insert(0, "scripts"); sys.path.insert(0, ".")
          import dense
          assert dense.build_dense_index([{"id": "a", "name": "n", "description": "d"}]) is None
          assert dense.http_embedder()("text") is None
          assert "lexical only" in dense.dense_status()
          print("ok: dense off by default even with numpy available")
          PY
      - name: MCP tool probing is off unless asked, and starts nothing
        run: |
          python3 - <<'PY'
          import os, sys
          os.environ.pop("MCP_TRIAGE_PROBE_TOOLS", None)
          sys.path.insert(0, "scripts")
          import mcp_tools
          started = []
          mcp_tools.probe = lambda *a, **k: started.append(1)
          assert mcp_tools.tool_map({"s": {"command": "echo"}}) == {}
          assert not started, "probing must start nothing when disabled"
          print("ok: mcp probe inert by default")
          PY
      - name: Catalog smoke on an empty home (must not crash or invent records)
        run: |
          mkdir -p /tmp/emptyhome /tmp/emptyproj
          python3 scripts/catalog.py --project /tmp/emptyproj --home /tmp/emptyhome --json | grep -q '^\[\]$'
      - name: Ranking smoke — a suggestion must trace to a real path
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          out = subprocess.run(
              [sys.executable, "scripts/triage_rank.py", "debug a failing pytest suite",
               "--project", "/tmp/emptyproj", "--json"],
              capture_output=True, text=True, check=True).stdout
          parts = json.loads(out)
          for bucket in parts.values():
              for hit in bucket:
                  assert hit.get("path") is not None, hit
          print("ok: every hit carries a path")
          PY

  # The environment a plain install actually runs in: stdlib only, no numpy.
  # Invariant #3 says the default path needs no third-party package, and a claim
  # that is never executed in a bare interpreter is a claim, not a guarantee.
  bare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest only
        run: python -m pip install pytest
      - name: Confirm numpy really is absent
        # Without this, numpy leaking in would turn the skips below into silent
        # coverage and this job would pass while proving nothing.
        run: |
          python -c "
          import importlib.util
          assert importlib.util.find_spec('numpy') is None, 'numpy present: this job must stay bare'
          print('ok: bare environment')"
      - name: Suite still passes with the optional dependency missing
        run: python -m pytest tests/ -q
      - name: The whole tool works without numpy
        run: |
          mkdir -p /tmp/emptyhome /tmp/emptyproj
          python3 -c "import declared_core; print('engine ok', declared_core.__version__)"
          python3 scripts/catalog.py --project /tmp/emptyproj --home /tmp/emptyhome --json | grep -q '^\[\]$'
          python3 scripts/triage_rank.py "debug a failing pytest suite" --project /tmp/emptyproj --json > /dev/null
          echo "ok: catalog and ranking run stdlib-only"
